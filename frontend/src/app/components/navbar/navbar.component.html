<header class="bar glass">
  <div class="brand">
    <svg class="logo" viewBox="70 80 260 260" role="img" [attr.aria-label]="i18n.translate('Logo de IRIS')">
      <defs>
        <clipPath id="hc">
          <path d="M92 210 Q200 70 308 210 Q200 350 92 210 Z">
            <animate
              attributeName="d"
              dur="5s"
              repeatCount="indefinite"
              calcMode="spline"
              keyTimes="0;0.86;0.92;0.97;1"
              keySplines="0 0 1 1;0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1"
              values="M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 210 308 210 Q200 210 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z"
            />
          </path>
        </clipPath>
      </defs>
      <g class="lg-orbit">
        <circle cx="200" cy="210" r="124" fill="none" stroke-width="6" stroke-dasharray="1 16" stroke-linecap="round" style="stroke:var(--accent)" />
        <g transform="translate(287.7 122.3) rotate(45)">
          <rect x="-24" y="-5" width="14" height="10" rx="2" style="fill:var(--primary)" />
          <rect x="10" y="-5" width="14" height="10" rx="2" style="fill:var(--primary)" />
          <circle r="11" stroke-width="3" style="fill:var(--accent);stroke:var(--bg)" />
        </g>
      </g>
      <path d="M92 210 Q200 70 308 210 Q200 350 92 210 Z" style="fill:var(--surface)">
        <animate
          attributeName="d"
          dur="5s"
          repeatCount="indefinite"
          calcMode="spline"
          keyTimes="0;0.86;0.92;0.97;1"
          keySplines="0 0 1 1;0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1"
          values="M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 210 308 210 Q200 210 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z"
        />
      </path>
      <g clip-path="url(#hc)">
        <circle cx="200" cy="210" r="62" stroke-width="7" style="fill:var(--surface-2);stroke:var(--primary-hover)" />
        <g stroke-width="6" stroke-linecap="round" opacity=".5" style="stroke:var(--primary)">
          <line x1="232" y1="210" x2="256" y2="210" />
          <line x1="227.7" y1="226" x2="248.5" y2="238" />
          <line x1="216" y1="237.7" x2="228" y2="258.5" />
          <line x1="200" y1="242" x2="200" y2="266" />
          <line x1="184" y1="237.7" x2="172" y2="258.5" />
          <line x1="172.3" y1="226" x2="151.5" y2="238" />
          <line x1="168" y1="210" x2="144" y2="210" />
          <line x1="172.3" y1="194" x2="151.5" y2="182" />
          <line x1="184" y1="182.3" x2="172" y2="161.5" />
          <line x1="200" y1="178" x2="200" y2="154" />
          <line x1="216" y1="182.3" x2="228" y2="161.5" />
          <line x1="227.7" y1="194" x2="248.5" y2="182" />
        </g>
        <circle cx="200" cy="210" r="30" stroke-width="4" style="fill:var(--bg);stroke:var(--border)" />
        <g transform="translate(200 210) scale(0.6) translate(-200 -213)">
          <path d="M200 182 C212 196 224 204 224 220 C224 234 213 244 200 244 C187 244 176 234 176 220 C176 210 182 204 188 198 C189 205 193 208 196 208 C194 198 196 189 200 182 Z" style="fill:var(--sev-3)" />
          <path d="M200 208 C207 216 213 221 213 230 C213 238 207 243 200 243 C193 243 187 238 187 230 C187 224 192 220 195 216 C196 220 198 221 199 221 C198 216 198 212 200 208 Z" style="fill:var(--accent)" />
        </g>
      </g>
      <path fill="none" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" d="M92 210 Q200 70 308 210 Q200 350 92 210 Z" style="stroke:var(--primary)">
        <animate
          attributeName="d"
          dur="5s"
          repeatCount="indefinite"
          calcMode="spline"
          keyTimes="0;0.86;0.92;0.97;1"
          keySplines="0 0 1 1;0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1"
          values="M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 210 308 210 Q200 210 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z;M92 210 Q200 70 308 210 Q200 350 92 210 Z"
        />
      </path>
    </svg>
    <div>
      <h1>IRIS</h1>
      <p>Infrared Remote Incident System</p>
    </div>
  </div>

  <div class="actions">
    <button
      class="btn live"
      id="btnLive"
      [attr.aria-pressed]="live()"
      [title]="i18n.translate('Recibir focos nuevos en tiempo real')"
      (click)="toggleLive.emit()"
    >
      <span class="dot"></span>{{ i18n.translate('En vivo') }}
    </button>

    <button
      class="btn news"
      id="btnNews"
      [attr.aria-pressed]="warnActive()"
      [title]="i18n.translate('Mostrar focos nuevos en el mapa')"
      (click)="toggleWarn.emit()"
    >
      <span class="lbl">{{ i18n.translate('Nuevo ⚠️') }}</span>
      @if (warnCount() > 0) {
        <span class="news-count">{{ warnCount().toLocaleString(i18n.locale()) }}</span>
      }
    </button>

    <button
      class="btn"
      id="btnTl"
      [attr.aria-pressed]="timelineOpen()"
      [title]="i18n.translate('Línea del tiempo')"
      (click)="toggleTimeline.emit()"
    >
      <span>🕒</span><span class="tx">{{ i18n.translate('Línea del tiempo') }}</span>
    </button>

    <button
      class="btn"
      id="btnHist"
      [title]="i18n.translate('Historial de incendios (2000–presente)')"
      (click)="openHistory.emit()"
    >
      <span>📊</span><span class="tx">{{ i18n.translate('Historial') }}</span>
    </button>

    <button
      class="btn"
      id="btnPred"
      [attr.aria-pressed]="predictionOpen()"
      [title]="i18n.translate('Probabilidades de incendio (experimental)')"
      (click)="togglePrediction.emit()"
    >
      <span>🔮</span><span class="tx">{{ i18n.translate('Probabilidades') }}</span>
    </button>

    <div class="langwrap">
      <button
        class="btn lang"
        id="btnLang"
        aria-haspopup="menu"
        [attr.aria-expanded]="langMenuOpen()"
        [attr.aria-label]="i18n.translate('Lenguaje')"
        [title]="i18n.translate('Lenguaje')"
        (click)="toggleLangMenu($event)"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18" />
        </svg>
        <span class="tx">{{ i18n.translate('Lenguaje') }}</span>
        <span class="car">▾</span>
      </button>

      <div #langMenuEl class="lmenu glass" id="lmenu" role="menu" [hidden]="!langMenuOpen()">
        <button role="menuitemradio" data-l="en" [attr.aria-checked]="i18n.lang() === 'en'" (click)="selectLanguage('en')">
          <span class="ll">
            <svg class="fl" viewBox="0 0 30 20" aria-hidden="true">
              <rect y="0.000" width="30" height="1.558" fill="#B22234" />
              <rect y="1.538" width="30" height="1.558" fill="#FFFFFF" />
              <rect y="3.077" width="30" height="1.558" fill="#B22234" />
              <rect y="4.615" width="30" height="1.558" fill="#FFFFFF" />
              <rect y="6.154" width="30" height="1.558" fill="#B22234" />
              <rect y="7.692" width="30" height="1.558" fill="#FFFFFF" />
              <rect y="9.231" width="30" height="1.558" fill="#B22234" />
              <rect y="10.769" width="30" height="1.558" fill="#FFFFFF" />
              <rect y="12.308" width="30" height="1.558" fill="#B22234" />
              <rect y="13.846" width="30" height="1.558" fill="#FFFFFF" />
              <rect y="15.385" width="30" height="1.558" fill="#B22234" />
              <rect y="16.923" width="30" height="1.558" fill="#FFFFFF" />
              <rect y="18.462" width="30" height="1.558" fill="#B22234" />
              <rect width="12.4" height="10.77" fill="#3C3B6E" />
              <g fill="#fff">
                <circle cx="1.1" cy="1.15" r=".42" /><circle cx="3.1" cy="1.15" r=".42" /><circle cx="5.1" cy="1.15" r=".42" /><circle cx="7.1" cy="1.15" r=".42" /><circle cx="9.1" cy="1.15" r=".42" /><circle cx="11.1" cy="1.15" r=".42" />
                <circle cx="2.1" cy="2.22" r=".42" /><circle cx="4.1" cy="2.22" r=".42" /><circle cx="6.1" cy="2.22" r=".42" /><circle cx="8.1" cy="2.22" r=".42" /><circle cx="10.1" cy="2.22" r=".42" />
                <circle cx="1.1" cy="3.29" r=".42" /><circle cx="3.1" cy="3.29" r=".42" /><circle cx="5.1" cy="3.29" r=".42" /><circle cx="7.1" cy="3.29" r=".42" /><circle cx="9.1" cy="3.29" r=".42" /><circle cx="11.1" cy="3.29" r=".42" />
                <circle cx="2.1" cy="4.36" r=".42" /><circle cx="4.1" cy="4.36" r=".42" /><circle cx="6.1" cy="4.36" r=".42" /><circle cx="8.1" cy="4.36" r=".42" /><circle cx="10.1" cy="4.36" r=".42" />
                <circle cx="1.1" cy="5.43" r=".42" /><circle cx="3.1" cy="5.43" r=".42" /><circle cx="5.1" cy="5.43" r=".42" /><circle cx="7.1" cy="5.43" r=".42" /><circle cx="9.1" cy="5.43" r=".42" /><circle cx="11.1" cy="5.43" r=".42" />
                <circle cx="2.1" cy="6.50" r=".42" /><circle cx="4.1" cy="6.50" r=".42" /><circle cx="6.1" cy="6.50" r=".42" /><circle cx="8.1" cy="6.50" r=".42" /><circle cx="10.1" cy="6.50" r=".42" />
                <circle cx="1.1" cy="7.57" r=".42" /><circle cx="3.1" cy="7.57" r=".42" /><circle cx="5.1" cy="7.57" r=".42" /><circle cx="7.1" cy="7.57" r=".42" /><circle cx="9.1" cy="7.57" r=".42" /><circle cx="11.1" cy="7.57" r=".42" />
                <circle cx="2.1" cy="8.64" r=".42" /><circle cx="4.1" cy="8.64" r=".42" /><circle cx="6.1" cy="8.64" r=".42" /><circle cx="8.1" cy="8.64" r=".42" /><circle cx="10.1" cy="8.64" r=".42" />
                <circle cx="1.1" cy="9.71" r=".42" /><circle cx="3.1" cy="9.71" r=".42" /><circle cx="5.1" cy="9.71" r=".42" /><circle cx="7.1" cy="9.71" r=".42" /><circle cx="9.1" cy="9.71" r=".42" /><circle cx="11.1" cy="9.71" r=".42" />
              </g>
            </svg>English
          </span>
        </button>
        <button role="menuitemradio" data-l="es" [attr.aria-checked]="i18n.lang() === 'es'" (click)="selectLanguage('es')">
          <span class="ll">
            <svg class="fl" viewBox="0 0 30 20" aria-hidden="true">
              <rect width="10" height="20" fill="#006847" />
              <rect x="10" width="10" height="20" fill="#FFFFFF" />
              <rect x="20" width="10" height="20" fill="#CE1126" />
              <circle cx="15" cy="10" r="2.7" fill="#B08A46" />
              <circle cx="15" cy="10" r="1.2" fill="#5E8B3A" />
            </svg>Español
          </span>
        </button>
      </div>
    </div>

    <div class="search" id="search" [class.open]="searchOpen()">
      <input
        #searchInput
        id="q"
        type="text"
        [value]="query()"
        (input)="onSearchInput(searchInput.value)"
        (keydown)="onSearchKeydown($event)"
        [placeholder]="i18n.translate('Lugar o coordenadas (19.04, -98.2)')"
        [attr.aria-label]="i18n.translate('Buscar lugar o coordenadas')"
        autocomplete="off"
      />
      <button
        class="btn icon"
        id="btnSearch"
        [attr.aria-label]="i18n.translate('Buscar')"
        [title]="i18n.translate('Buscar')"
        (click)="onSearchButtonClick()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.6-3.6" />
        </svg>
      </button>

      <div #sugBoxEl class="sug glass" id="sug" [hidden]="suggestions().length === 0">
        @for (feat of suggestions(); track feat.place_name) {
          <button (click)="pickSuggestion(feat)">
            <b>{{ feat.text }}</b> <small>{{ formatSubPlace(feat) }}</small>
          </button>
        }
      </div>
    </div>
  </div>
</header>
